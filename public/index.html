<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat · Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid #26292f;
      font-weight: 600;
    }
    header small { display: block; font-weight: 400; color: #8b8f98; margin-top: 2px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #2f56ef; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #23262d; }
    .msg.error { align-self: center; background: #3a1d1f; color: #ffb4b4; font-size: 14px; }
    form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid #26292f;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #33373f;
      background: #181b20;
      color: inherit;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #2f56ef; }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2f56ef;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    Chat con Mistral AI
    <small>Modelo: mistral-small-latest · streaming</small>
  </header>

  <div id="chat" aria-live="polite"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Escribe un mensaje…" autocomplete="off" autofocus />
    <button type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const button = form.querySelector("button");
    const history = [];

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || button.disabled) return;

      input.value = "";
      addMsg("user", text);
      history.push({ role: "user", content: text });

      const reply = addMsg("assistant", "");
      button.disabled = true;

      let full = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Error " + res.status);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") continue;
            const data = JSON.parse(payload);
            if (data.error) throw new Error(data.error);
            if (data.delta) {
              full += data.delta;
              reply.textContent = full;
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }

        if (!full) throw new Error("Respuesta vacía del servidor");
        history.push({ role: "assistant", content: full });
      } catch (err) {
        reply.remove();
        addMsg("error", err.message);
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
